# Sign in with Apple verifies domain ownership by fetching this exact file.
# Exact-match (=) on purpose: it must not shadow /.well-known/acme-challenge/,
# which certbot uses to renew the certificate.
location = /.well-known/apple-developer-domain-association.txt {
    alias /var/www/apple/apple-developer-domain-association.txt;
    default_type text/plain;
}
